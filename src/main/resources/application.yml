spring:
  profiles:
    include: secret

  lifecycle:
    timeout-per-shutdown-phase: 30s

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:mysql://localhost:3306/mockstock
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: false

    show-sql: false

# Hibernate SQL은 콘솔에서 숨기고 실제 경고와 오류는 유지한다.
logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: OFF

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# 15:30~16:00 시간외 REST 데이터 조회 주기를 밀리초 단위로 설정한다.
kis:
  realtime-subscription-refresh-interval-ms: 5000
  realtime-subscription-initial-delay-ms: 5000

app:
  password-reset-url: ${PASSWORD_RESET_URL:http://localhost:8080/reset-password}
  websocket:
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
  cleanup:
    cron: ${OPERATIONAL_CLEANUP_CRON:0 20 3 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
