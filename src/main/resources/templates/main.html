<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVault - Main</title>

    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/order.css}" href="/css/order.css">
    <link rel="stylesheet" th:href="@{/css/app-light.css}" href="/css/app-light.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="dashboard-panel active" id="dashboard-watchlist">
    <main class="main-layout">
        <section class="chart-panel">
            <div class="panel-header">
                <h1>차트</h1>
            </div>

            <div class="chart-placeholder">
                <p>종목을 선택해 주세요.</p>
                <span>관심종목 또는 검색 결과에서 종목을 선택할 수 있습니다.</span>
            </div>
        </section>

        <aside class="side-panel">
            <div class="panel-header">
                <h2>종목정보</h2>
            </div>
        </aside>

        <aside class="watchlist-panel">
            <div class="panel-header">
                <h2>관심종목</h2>
            </div>

            <div class="empty-state">
                <p>저장한 종목이 없습니다.</p>
                <span>검색으로 관심종목을 추가할 수 있습니다.</span>
            </div>
        </aside>
    </main>
</section>

<div th:replace="~{fragments/order_modal :: orderModal}"></div>

<script th:src="@{/js/header.js}" src="/js/header.js"></script>
<script th:src="@{/js/main.js}" src="/js/main.js"></script>
<script th:src="@{/js/order.js}" src="/js/order.js"></script>
</body>
</html>
