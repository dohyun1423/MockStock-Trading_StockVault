<!DOCTYPE html>
<!-- 이메일로 전달된 일회용 토큰을 사용해 새 비밀번호를 설정하는 화면이다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVault - 새 비밀번호 설정</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body class="password-reset-page">
<main class="reset-layout">
    <a class="reset-brand" href="/login" aria-label="로그인 화면으로 이동">
        <span class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <polyline points="2,14 6,9 10,11 14,5 18,7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="brand-name">STOCK<span>VAULT</span></span>
    </a>

    <section class="reset-panel" aria-labelledby="reset-password-title">
        <div class="form-tag">NEW PASSWORD</div>
        <h1 class="reset-title" id="reset-password-title">새 비밀번호 설정</h1>
        <p class="reset-description">이전에 사용하지 않은 8자 이상의 새 비밀번호를 입력해 주세요.</p>

        <form id="reset-password-form">
            <div class="field-group reset-field-group">
                <div class="field">
                    <label for="new-password">NEW PASSWORD</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="new-password" name="newPassword" autocomplete="new-password" minlength="8" maxlength="64" required>
                        <button
                                class="toggle-pw"
                                type="button"
                                onclick="toggleResetPasswordVisibility('new-password', this)"
                                aria-label="비밀번호 표시"
                        >
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <div class="input-wrap">
                        <span class="icon" aria-hidden="true">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                        </span>
                        <input type="password" id="confirm-password" name="confirmPassword" autocomplete="new-password" minlength="8" maxlength="64" required>
                        <button
                                class="toggle-pw"
                                type="button"
                                onclick="toggleResetPasswordVisibility('confirm-password', this)"
                                aria-label="비밀번호 표시"
                        >
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <button class="btn-submit reset-submit" type="submit">비밀번호 변경</button>
            <p class="reset-message" id="reset-message" role="status"></p>
        </form>

        <a class="reset-back-link" href="/login">로그인으로 돌아가기</a>
    </section>
</main>

<script th:src="@{/js/password_reset.js}" src="/js/password_reset.js"></script>
</body>
</html>
