<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVault - Portfolio</title>

    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/header.css}" href="/css/header.css">
    <link rel="stylesheet" th:href="@{/css/order.css}" href="/css/order.css">
    <link rel="stylesheet" th:href="@{/css/portfolio.css}" href="/css/portfolio.css">
    <link rel="stylesheet" th:href="@{/css/app-light.css}" href="/css/app-light.css">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="portfolio-layout">
    <section class="portfolio-header">
        <div>
            <p>내 자산</p>
            <h1>내 주식</h1>
        </div>
    </section>

    <nav class="portfolio-tabs" aria-label="내 주식 메뉴">
        <button type="button" class="active" data-portfolio-tab="overview">자산현황</button>
        <button type="button" data-portfolio-tab="holdings">보유종목</button>
        <button type="button" data-portfolio-tab="open-orders">미체결 주문</button>
        <button type="button" data-portfolio-tab="trades">거래내역</button>
    </nav>

    <div class="portfolio-tab-panel active" id="portfolio-tab-overview">
        <section class="portfolio-summary-grid">
            <div class="summary-card">
                <span>보유 현금</span>
                <strong id="cash-balance">-</strong>
            </div>

            <div class="summary-card">
                <span>주문 가능</span>
                <strong id="available-cash">-</strong>
            </div>

            <div class="summary-card">
                <span>예약 현금</span>
                <strong id="reserved-cash">-</strong>
            </div>

            <div class="summary-card">
                <span>총 자산</span>
                <strong id="total-asset">-</strong>
            </div>

            <div class="summary-card">
                <span>총 평가금액</span>
                <strong id="total-evaluation">-</strong>
            </div>

            <div class="summary-card">
                <span>총 손익</span>
                <strong id="total-profit-loss">-</strong>
            </div>

            <div class="summary-card">
                <span>총 수익률</span>
                <strong id="total-profit-rate">-</strong>
            </div>
        </section>
    </div>

    <div class="portfolio-tab-panel" id="portfolio-tab-holdings">
        <section class="holding-section">
            <div class="section-header">
                <h2>보유종목</h2>
            </div>

            <div class="holding-table-wrap" id="holding-table-wrap">
                <div class="portfolio-empty">
                    <p>보유 종목이 없습니다.</p>
                    <span>관심종목이나 상세 화면에서 매수를 진행해보세요.</span>
                </div>
            </div>
        </section>
    </div>

    <div class="portfolio-tab-panel" id="portfolio-tab-open-orders">
        <section class="open-order-section">
            <div class="section-header">
                <h2>미체결 주문</h2>
            </div>

            <div class="open-order-table-wrap" id="open-order-table-wrap">
                <div class="portfolio-empty small">
                    <p>미체결 주문이 없습니다.</p>
                    <span>원하는 가격으로 주문하면 이곳에서 수정하거나 취소할 수 있습니다.</span>
                </div>
            </div>
        </section>
    </div>

    <div class="portfolio-tab-panel" id="portfolio-tab-trades">
        <section class="trade-section">
            <div class="section-header">
                <h2>거래내역</h2>
            </div>

            <div class="trade-table-wrap" id="trade-table-wrap">
                <div class="portfolio-empty">
                    <p>거래내역이 없습니다.</p>
                    <span>체결된 매수·매도 내역이 표시됩니다.</span>
                </div>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/order_modal :: orderModal}"></div>

<script th:src="@{/js/header.js}" src="/js/header.js"></script>
<script th:src="@{/js/order.js}" src="/js/order.js"></script>
<script th:src="@{/js/portfolio.js}" src="/js/portfolio.js"></script>
</body>
</html>
