<!DOCTYPE html>
<!-- 가입 이메일로 비밀번호 재설정 링크를 요청하는 화면이다. -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockVault - 비밀번호 찾기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/common.css}" href="/css/common.css">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body class="password-reset-page">
<main class="reset-layout">
    <a class="reset-brand" href="/login" aria-label="로그인 화면으로 이동">
        <span class="brand-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <polyline points="2,14 6,9 10,11 14,5 18,7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
        <span class="brand-name">STOCK<span>VAULT</span></span>
    </a>

    <section class="reset-panel" aria-labelledby="reset-request-title">
        <div class="form-tag">ACCOUNT RECOVERY</div>
        <h1 class="reset-title" id="reset-request-title">비밀번호 찾기</h1>
        <p class="reset-description">가입한 이메일로 15분 동안 사용할 수 있는 재설정 링크를 보내드립니다.</p>

        <form id="forgot-password-form">
            <div class="field">
                <label for="reset-email">EMAIL ADDRESS</label>
                <div class="input-wrap">
                    <span class="icon" aria-hidden="true">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input type="email" id="reset-email" name="email" autocomplete="username" placeholder="your@email.com" required>
                </div>
            </div>

            <button class="btn-submit reset-submit" type="submit">재설정 링크 받기</button>
            <p class="reset-message" id="reset-message" role="status"></p>
        </form>

        <a class="reset-back-link" href="/login">로그인으로 돌아가기</a>
    </section>
</main>

<script th:src="@{/js/password_reset.js}" src="/js/password_reset.js"></script>
</body>
</html>
